# Case File Manager services. The launcher manages this project; it only ever
# runs `docker compose up/stop` on the services below, by name.
#
# Required in .env (the installer writes it):
#   CFM_DATA_DIR   absolute path to the data folder, e.g. C:/CaseFiles/data
#   CFM_CERTS_DIR  absolute path to the certificate folder, e.g. C:/CaseFiles/certs
#                  (only server.crt and server.key are mounted, never the CA key)
# Optional:
#   CFM_APP_PORT   web app HTTPS port on the LAN (default 443)
#   CFM_VERSION    image version label

name: casefiles

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp:size=64m"]
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  api:
    <<: *hardening
    build:
      context: ../services/api
      args: { APP_VERSION: "${CFM_VERSION:-0.1.0-dev}" }
    image: casefiles-api:${CFM_VERSION:-0.1.0-dev}
    environment:
      DEPLOY_MODE: local
      DATA_DIR: /data
      REDIS_URL: redis://queue:6379/0
      PORT: "8443"
    volumes:
      - ${CFM_DATA_DIR:?Set CFM_DATA_DIR in deploy/.env}:/data
      - ${CFM_CERTS_DIR:?Set CFM_CERTS_DIR in deploy/.env}/server.crt:/certs/server.crt:ro
      - ${CFM_CERTS_DIR}/server.key:/certs/server.key:ro
    ports:
      # The only published port. Windows Firewall should allow it on
      # Private networks only (the installer adds that rule).
      - "${CFM_APP_PORT:-443}:8443"
    networks: [backend, frontend]
    depends_on:
      queue: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "/srv/healthcheck.py"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    <<: *hardening
    image: casefiles-api:${CFM_VERSION:-0.1.0-dev}
    entrypoint: ["python", "-m", "app.worker"]
    environment:
      DEPLOY_MODE: local
      DATA_DIR: /data
      REDIS_URL: redis://queue:6379/0
    volumes:
      - ${CFM_DATA_DIR}:/data
    # No internet access: case data never leaves through the worker.
    networks: [backend]
    depends_on:
      api: { condition: service_started }
      queue: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker", "health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  queue:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "", "--protected-mode", "no"]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    volumes:
      - ${CFM_DATA_DIR}/queue:/data
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  ocr:
    <<: *hardening
    build:
      context: ../services/tools
      dockerfile: Dockerfile.ocr
      args: { APP_VERSION: "${CFM_VERSION:-0.1.0-dev}" }
    image: casefiles-ocr:${CFM_VERSION:-0.1.0-dev}
    networks: [backend]
    healthcheck:
      test: ["CMD", "python", "/srv/health.py", "check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  pst:
    <<: *hardening
    build:
      context: ../services/tools
      dockerfile: Dockerfile.pst
      args: { APP_VERSION: "${CFM_VERSION:-0.1.0-dev}" }
    image: casefiles-pst:${CFM_VERSION:-0.1.0-dev}
    networks: [backend]
    healthcheck:
      test: ["CMD", "python", "/srv/health.py", "check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  models:
    image: ollama/ollama:0.34.4
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    environment:
      OLLAMA_NOPRUNE: "1"
    volumes:
      - ${CFM_DATA_DIR}/models:/root/.ollama
    # backend for the worker; egress only so models can be downloaded.
    networks: [backend, egress]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

networks:
  backend:
    internal: true
  frontend: {}
  egress: {}
